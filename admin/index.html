<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1f5fd" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; frame-src https://eduthon-2026-apply.s0313hy.chatgpt.site; child-src https://eduthon-2026-apply.s0313hy.chatgpt.site; connect-src 'none'; img-src 'none'; media-src 'none'; font-src 'none'; manifest-src 'none'; worker-src 'none'; script-src 'sha256-a5DlQDWfZe4RW7bTcH5/NptaQS7V36Dg8BfBBNzwCJw='; style-src 'sha256-ea4BuGTRpo/5rTskLXL+ggFgqM16ViV6m3yx2hnE0AQ='; upgrade-insecure-requests"
    />
    <script>
      (() => {
        "use strict";

        let capturedFragment = window.location.hash;
        window.history.replaceState(null, "", window.location.pathname + window.location.search);

        if (capturedFragment.startsWith("#")) {
          capturedFragment = capturedFragment.slice(1);
        }
        let candidateCode = new URLSearchParams(capturedFragment).get("code");
        capturedFragment = "";
        let pendingCode =
          typeof candidateCode === "string" && /^[A-Za-z0-9_-]{43}$/.test(candidateCode)
            ? candidateCode
            : null;
        candidateCode = null;

        window.addEventListener(
          "DOMContentLoaded",
          () => {
            if (!pendingCode) {
              return;
            }

            const trustedOrigin = "https://eduthon-2026-apply.s0313hy.chatgpt.site";
            const embedUrl = new URL("/admin/embed", trustedOrigin);
            const frame = document.getElementById("admin-frame");
            const gate = document.getElementById("gate");

            const handoffOnce = (event) => {
              if (
                !pendingCode ||
                event.origin !== trustedOrigin ||
                event.source !== frame.contentWindow ||
                event.data?.type !== "eduthon-admin-ready"
              ) {
                return;
              }

              const codeForHandoff = pendingCode;
              pendingCode = null;
              window.removeEventListener("message", handoffOnce);
              frame.contentWindow.postMessage(
                { type: "eduthon-admin-handoff", code: codeForHandoff },
                trustedOrigin,
              );
            };

            window.addEventListener("message", handoffOnce);
            frame.src = embedUrl.href;
            frame.hidden = false;
            gate.hidden = true;
          },
          { once: true },
        );
      })();
    </script>
    <title>에듀톤 관리자</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f1f5fd;
        color: #0b2a63;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #f1f5fd;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      [hidden] {
        display: none !important;
      }

      .gate {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(100%, 520px);
        padding: 36px 28px;
        border: 1px solid #c9dbfb;
        border-radius: 22px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(11, 42, 99, 0.1);
        text-align: center;
      }

      .label {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        justify-content: center;
        margin: 0 0 18px;
        padding: 7px 16px;
        border-radius: 999px;
        background: #0b2a63;
        color: #ffffff;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.25;
        letter-spacing: -0.04em;
      }

      p {
        margin: 16px 0 0;
        color: #52627e;
        font-size: 16px;
        line-height: 1.7;
      }

      .login {
        display: inline-flex;
        width: 100%;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        border-radius: 14px;
        background: #3268d5;
        color: #ffffff;
        font-size: 17px;
        font-weight: 800;
        text-decoration: none;
      }

      .login:hover {
        background: #2558bd;
      }

      .login:focus-visible {
        outline: 4px solid rgba(50, 104, 213, 0.3);
        outline-offset: 3px;
      }

      iframe {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        background: #f1f5fd;
      }

      .noscript {
        position: fixed;
        inset: 0;
        z-index: 2;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f1f5fd;
      }
    </style>
  </head>
  <body>
    <main id="gate" class="gate">
      <section class="card" aria-labelledby="admin-title">
        <div class="label">ADMIN ONLY</div>
        <h1 id="admin-title">에듀톤 관리자</h1>
        <p id="gate-message">관리자 인증 후 신청자 목록을 확인할 수 있습니다.</p>
        <a
          class="login"
          href="https://tinyurl.com/bnuedu-admin"
          rel="noreferrer noopener"
        >관리자 로그인</a>
      </section>
    </main>
    <iframe
      id="admin-frame"
      title="에듀톤 관리자 신청자 목록"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-downloads allow-top-navigation-by-user-activation"
      hidden
    ></iframe>
    <noscript>
      <div class="noscript">
        <section class="card">
          <div class="label">ADMIN ONLY</div>
          <h1>JavaScript가 필요합니다.</h1>
          <p>관리자 인증을 계속하려면 브라우저에서 JavaScript를 켜 주세요.</p>
        </section>
      </div>
    </noscript>
  </body>
</html>
